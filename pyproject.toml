[project]
name = "pacman"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mazegenerator",
    "pygame>=2.6.1",
]



[tool.uv.sources]
mazegenerator = { path = "lib/mazegenerator-2.0.2-py3-none-any.whl" }

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.1.0",
    "pyinstaller>=6.21.0",
]

[[tool.mypy.overrides]]
module = "mazegenerator"
ignore_missing_imports = true
